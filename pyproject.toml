[project]
name = "pytest-codex"
version = "0.1.0"
description = "Test Codex behavior with pytest fixtures, offline record/replay, and pass-rate checks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "CZJ" }]
keywords = ["pytest", "codex", "openai", "agents", "AGENTS.md", "llm", "testing", "evals"]
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7"]

[project.entry-points.pytest11]
"pytest_codex.plugin" = "pytest_codex.plugin"

[project.urls]
Homepage = "https://github.com/Czj027/pytest-codex"
Repository = "https://github.com/Czj027/pytest-codex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_codex"]

[tool.hatch.build.targets.sdist]
include = ["/src/pytest_codex", "/tests", "/examples", "/docs", "/README.md", "/README.zh-CN.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/.github", "/.gitattributes"]

[dependency-groups]
dev = ["ruff>=0.6", "build>=1", "twine>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"

[tool.ruff]
line-length = 100
target-version = "py310"
