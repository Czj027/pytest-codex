name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . ruff build twine
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m pytest -q
      - run: python -m pytest examples --codex-bin=not-installed -q
      - run: python -m build
      - run: python -m twine check dist/*

  pytest-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install . pytest==7.0.0
      - run: python -m pytest -q
      - run: python -m pytest examples --codex-bin=not-installed -q
